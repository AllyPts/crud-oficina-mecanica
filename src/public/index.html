<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistema Oficina Mecânica</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <header>
            <h1>Sistema de Oficina Mecânica</h1>
            <p>Gerenciamento de Clientes e Veículos</p>
        </header>

        <!-- CLIENTES -->
        <section class="card formulario-card">

            <h2>Cadastrar Cliente</h2>

            <form id="formCliente">

                <div class="campo">
                    <label>Nome</label>
                    <input type="text" id="nome" placeholder="Digite o nome" required>
                </div>

                <div class="campo">
                    <label>Telefone</label>
                    <input type="text" id="telefone" placeholder="Digite o telefone">
                </div>

                <div class="campo">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="Digite o email">
                </div>

                <button type="submit" class="btn-cadastrar">
                    Cadastrar Cliente
                </button>

            </form>

        </section>

        <!-- VEÍCULOS -->
        <section class="card formulario-card">

            <h2>Cadastrar Veículo</h2>

            <form id="formVeiculo">

                <div class="campo">
                    <label>ID Cliente</label>
                    <input type="number" id="cliente_id" placeholder="ID do cliente" required>
                </div>

                <div class="campo">
                    <label>Modelo</label>
                    <input type="text" id="modelo" placeholder="Modelo do veículo" required>
                </div>

                <div class="campo">
                    <label>Marca</label>
                    <input type="text" id="marca" placeholder="Marca">
                </div>

                <div class="campo">
                    <label>Placa</label>
                    <input type="text" id="placa" placeholder="Placa" required>
                </div>

                <div class="campo">
                    <label>Ano</label>
                    <input type="number" id="ano" placeholder="Ano">
                </div>

                <button type="submit" class="btn-cadastrar">
                    Cadastrar Veículo
                </button>

            </form>

        </section>

        <section class="card tabela-card">

            <div class="topo-tabela">
                <h2>Clientes e Veículos</h2>

                <button onclick="carregarVeiculos()" class="btn-atualizar">
                    Atualizar Lista
                </button>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Cliente</th>
                        <th>Modelo</th>
                        <th>Marca</th>
                        <th>Placa</th>
                        <th>Ano</th>
                        <th>Ações</th>
                    </tr>
                </thead>

                <tbody id="listaVeiculos">
                </tbody>
            </table>

        </section>

    </div>

    <script src="script.js"></script>

</body>

</html>
