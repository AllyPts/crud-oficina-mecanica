<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistema Oficina Mecânica</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <header>
            <h1>Sistema de Oficina Mecânica</h1>
            <p>Gerenciamento de Clientes</p>
        </header>

        <section class="card formulario-card">

            <h2>Cadastrar Cliente</h2>

            <form id="formCliente">

                <div class="campo">
                    <label>Nome</label>

                    <input
                        type="text"
                        id="nome"
                        placeholder="Digite o nome"
                        required
                    >
                </div>

                <div class="campo">
                    <label>Telefone</label>

                    <input
                        type="text"
                        id="telefone"
                        placeholder="Digite o telefone"
                    >
                </div>

                <div class="campo">
                    <label>Email</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Digite o email"
                    >
                </div>

                <button type="submit" class="btn-cadastrar">
                    Cadastrar Cliente
                </button>

            </form>

        </section>

        <section class="card tabela-card">

            <div class="topo-tabela">
                <h2>Clientes Cadastrados</h2>

                <button onclick="carregarClientes()" class="btn-atualizar">
                    Atualizar Lista
                </button>
            </div>

            <table>

</html>
